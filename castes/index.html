  return '<option value="">— కులం —</option>'+(odd?'<option value="'+esc(cur)+'" selected>⚠ '+esc(cur)+'</option>':'')+
    CASTES.map(function(c){ return '<option value="'+c[0]+'"'+(c[0]===cur?' selected':'')+'>'+c[1]+' · '+c[0]+'</option>'; }).join('');
}

/* ---------- data ---------- */
function load(){
  call('getSurnames',['','']).then(function(data){
    rows = data.filter(function(r){ return r[1] && r[1].toLowerCase()!=='total'; }); bySur = {}; rows.forEach(function(r){ bySur[r[1]] = r; });
    st('','✓ అన్నీ సేవ్ అయ్యాయి · All saved'); route();
  }).catch(function(e){
    $('list').innerHTML='<div class="msg">లోడ్ కాలేదు · '+esc(e.message)+'<br><button class="retry" onclick="location.reload()">మళ్ళీ · Retry</button></div>';
  });
  loadVoters();
}
function loadVoters(){
  if (!votersP) votersP = call('getSurnameVoters',['','']).then(function(v){ voters = v; return v; })
    .catch(function(e){ votersP = null; throw e; });
  return votersP;
}

/* ---------- list view ---------- */
function renderList(){
  var filled = rows.filter(function(r){ return NAMES.indexOf(r[3])>=0; });
  var tot = rows.reduce(function(a,r){return a+r[2];},0), done = filled.reduce(function(a,r){return a+r[2];},0);
  $('prog').textContent = 'మొత్తం పూర్తి · Done: '+filled.length+' / '+rows.length+' ఇంటిపేర్లు ('+Math.round(100*done/Math.max(tot,1))+'% ఓటర్లు)';
  var cnt = {missing: rows.length-filled.length, all: rows.length, done: filled.length};
  var lbl = {missing:'కులం లేనివి', all:'అన్నీ', done:'ఉన్నవి'};
  [].forEach.call(document.querySelectorAll('.tab'), function(t){ t.textContent = lbl[t.dataset.m]+' ('+cnt[t.dataset.m]+')'; });
  $('pbar').style.width = (100*done/Math.max(tot,1))+'%';
  var list = rows.filter(function(r){
    var ok = NAMES.indexOf(r[3])>=0;
    if (mode==='missing' && ok) return false;
    if (mode==='done' && !ok) return false;
    return !q || r[1].toLowerCase().indexOf(q)>=0 || te(r[1]).indexOf(q)>=0;
  });
  if (!list.length){ $('list').innerHTML='<div class="msg">'+(mode==='missing'&&!q?'అన్నీ పూర్తయ్యాయి 🎉':'ఏమీ లేవు')+'</div>'; return; }
  $('list').innerHTML = list.slice(0,200).map(function(r){
    var cur=r[3], ok=NAMES.indexOf(cur)>=0;
    return '<div class="row" data-r="'+r[0]+'"><button class="nm" data-open="'+esc(r[1])+'"><b>'+esc(te(r[1])||r[1])+'</b>'+
      '<span>'+esc(r[1])+' · '+r[2]+' ఓటర్లు · <span class="go">చూడండి ›</span></span></button>'+
      '<select class="cs'+(ok?' set':'')+'" data-s="'+esc(r[1])+'">'+casteOptions(cur)+'</select></div>';
  }).join('') + (list.length>200?'<div class="msg">ఇంకా '+(list.length-200)+' — వెతకండి</div>':'');
}

/* ---------- one surname view ---------- */
function renderOne(s){
  var r = bySur[s];
  if (!r){ location.hash=''; return; }
  $('oneTitle').textContent = (te(s)||s);
  $('oneSub').textContent = s+' · '+r[2]+' ఓటర్లు';
  $('oneCaste').innerHTML = casteOptions(r[3]);
  $('oneCaste').className = 'cs big'+(NAMES.indexOf(r[3])>=0?' set':'');
  $('oneCaste').dataset.s = s;
  if (!voters){
    $('people').innerHTML='<div class="msg">ఓటర్ల జాబితా లోడ్ అవుతోంది… · Loading people…</div>';
    loadVoters().then(function(){ if (current()===s) renderOne(s); })
      .catch(function(e){ $('people').innerHTML='<div class="msg">లోడ్ కాలేదు · '+esc(e.message)+'<br><button class="retry" id="vr">మళ్ళీ · Retry</button></div>';
        $('vr').onclick=function(){ renderOne(s); }; });
    return;
  }
  var mine = voters.filter(function(v){ return v[0]===s; });
  var houses = {}, order = [];
  mine.forEach(function(v){ var k=v[7]+'|'+v[6]; if(!houses[k]){ houses[k]=[]; order.push(k); } houses[k].push(v); });
  if (!order.length){ $('people').innerHTML='<div class="msg">ఈ ఇంటిపేరుతో ఓటర్లు లేరు</div>'; return; }
  $('people').innerHTML = '<h3 style="margin:4px 2px 10px">'+mine.length+' ఓటర్లు · '+order.length+' ఇళ్ళు</h3>' + order.map(function(k){
    var hv = houses[k], h = hv[0];
    return '<div class="hh"><div class="hd">🏠 '+esc(h[6]||'—')+' <span>'+esc(h[8])+' · బూత్ '+esc(h[7])+'</span></div>'+
      hv.map(function(v){
        return '<div class="pp"><b>'+esc(v[1])+'</b><span>'+(v[5]==='Female'?'👩 స్త్రీ':'👨 పురుషుడు')+' · '+esc(v[4])+' ఏళ్ళు · '+(REL[v[2]]||esc(v[2]))+': '+esc(v[3])+'</span></div>';
      }).join('')+'</div>';
  }).join('');
}

/* ---------- routing (phone back button works) ---------- */
function current(){ var h=decodeURIComponent(location.hash.slice(1)); return h.indexOf('s=')===0 ? h.slice(2) : ''; }
function route(){
  if (!rows.length) return;
  var s = current();
  if (s){
    $('vList').classList.add('hide'); $('vOne').classList.remove('hide'); window.scrollTo(0,0); renderOne(s);
  } else {
    $('vOne').classList.add('hide'); $('vList').classList.remove('hide'); renderList(); window.scrollTo(0, listScroll);
  }
}
window.addEventListener('hashchange', route);
$('list').addEventListener('click', function(e){
  var b=e.target.closest('[data-open]'); if(!b) return;
  listScroll = window.scrollY; location.hash = 's='+encodeURIComponent(b.dataset.open);
});
$('back').onclick = function(){ if (history.length>1 && document.referrer!==location.href) history.back(); else location.hash=''; };

/* ---------- saving ---------- */
function setCaste(s, c){
  var r = bySur[s]; if (!r) return;
  r[3] = c;
  queue[r[0]] = { r:r[0], s:s, c:c };
  save();
}
function save(){
  var items = Object.keys(queue).map(function(k){ return queue[k]; });
  if (!items.length || busy) return;
  busy = true; queue = {};
  st('busy','⏳ సేవ్ అవుతోంది… · Saving');
  call('saveSurnameCastes',['','',items]).then(function(){
    busy=false;
    items.forEach(function(it){ var el=document.querySelector('[data-r="'+it.r+'"]'); if(el) el.classList.add('ok'); });
    if (Object.keys(queue).length) save(); else st('','✓ అన్నీ సేవ్ అయ్యాయి · All saved');
  }).catch(function(e){
    busy=false; items.forEach(function(it){ if(!queue[it.r]) queue[it.r]=it; });
    st('bad','⚠️ సేవ్ కాలేదు, మళ్ళీ ప్రయత్నిస్తాం · Retrying ('+e.message+')');
    setTimeout(save, 5000);
  });
}
$('list').addEventListener('change', function(e){
  var s=e.target; if (!s.dataset.s) return;
  s.className = 'cs'+(s.value?' set':''); setCaste(s.dataset.s, s.value);
});
$('oneCaste').addEventListener('change', function(){
  this.className = 'cs big'+(this.value?' set':''); setCaste(this.dataset.s, this.value);
});
document.querySelector('.tabs').onclick=function(e){
  var b=e.target.closest('[data-m]'); if(!b) return;
  mode=b.dataset.m; [].forEach.call(document.querySelectorAll('.tab'),function(t){ t.classList.toggle('on', t===b); }); renderList();
};
var t; $('q').oninput=function(){ clearTimeout(t); var v=this.value; t=setTimeout(function(){ q=v.trim().toLowerCase(); renderList(); },150); };
window.addEventListener('beforeunload',function(e){ if(busy||Object.keys(queue).length){ e.preventDefault(); e.returnValue=''; } });

load();
})();
</script>
</body>
</html>
