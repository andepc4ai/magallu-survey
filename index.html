<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Magallu Voter Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#fff; --ink:#1d1b16; --muted:#6b665c; --line:#e5dfd2;
  --brand:#b4461c; --brand-ink:#fff; --brand-soft:#fbe9df;
  --strong:#15803d; --leaning:#65a30d; --undecided:#d97706; --opposed:#dc2626;
  --ok:#15803d; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 96px}
.en{color:var(--muted);font-size:.78em;font-weight:400}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 14px 12px}
.top .row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top h1{font-size:1.05rem;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .who{font-size:.85rem;opacity:.9}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:10px;min-width:44px;height:40px;padding:0 10px;font-size:.9rem}
.prog{max-width:640px;margin:8px auto 0;display:flex;align-items:center;gap:10px;font-size:.88rem}
.bar{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{background:var(--card);border-radius:20px;padding:26px 22px;width:100%;max-width:420px;box-shadow:0 6px 30px rgba(0,0,0,.08)}
.login h2{margin:0 0 4px;font-size:1.4rem}
.login p{margin:0 0 18px;color:var(--muted)}
label.lb{display:block;font-weight:600;margin:14px 0 6px}
.field{width:100%;height:54px;border:2px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:1.1rem}
.field:focus{outline:none;border-color:var(--brand)}
.pin{letter-spacing:.6em;text-align:center;font-size:1.5rem}
.big{width:100%;height:58px;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:1.15rem;margin-top:20px}
.big:active{transform:scale(.99)}
.err{color:var(--opposed);margin-top:10px;min-height:1.2em;font-weight:600}

/* filters */
.search{position:relative;margin:12px 0 10px}
.search input{width:100%;height:52px;border:2px solid var(--line);border-radius:14px;padding:0 14px 0 44px;background:#fff;font-size:1.05rem}
.search input:focus{outline:none;border-color:var(--brand)}
.search svg{position:absolute;left:14px;top:15px;opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.95rem;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
select.field{height:50px;font-size:1rem;margin-bottom:8px}
.count{color:var(--muted);font-size:.9rem;margin:4px 2px 10px}

/* house list */
.house{background:var(--card);border-radius:var(--radius);margin-bottom:10px;padding:12px 14px;border:1px solid var(--line);display:block;width:100%;text-align:left}
.house:active{background:#fffaf5}
.house .hd{display:flex;align-items:center;gap:8px}
.hno{font-weight:700;font-size:1.08rem}
.badge{font-size:.78rem;border-radius:999px;padding:2px 9px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.badge.done{background:#dcfce7;color:var(--ok)}
.badge.new{background:#e0e7ff;color:#3730a3}
.house .st{color:var(--muted);font-size:.85rem;margin-top:2px}
.names{margin-top:6px;font-size:.95rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.nm{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:#d6d0c2;flex:none}
.dot.Strong{background:var(--strong)}.dot.Leaning{background:var(--leaning)}.dot.Undecided{background:var(--undecided)}.dot.Opposed{background:var(--opposed)}.dot.v{background:#94a3b8}
.more{width:100%;height:52px;border:2px dashed var(--line);background:transparent;border-radius:14px;font-weight:600;color:var(--muted)}

/* house screen */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto}
.sheet .top{position:sticky}
.hbox{background:var(--card);border-radius:var(--radius);padding:14px;margin:12px 0;border:1px solid var(--line)}
.hbox h3{margin:0 0 10px;font-size:1rem}
.wards{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wb{height:46px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:700;font-size:1.05rem}
.wb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.allv{width:100%;height:52px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:700;margin-top:12px;font-size:1.02rem}
.vc{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;border:1px solid var(--line);border-left:6px solid #d6d0c2}
.vc.Strong{border-left-color:var(--strong)}.vc.Leaning{border-left-color:var(--leaning)}.vc.Undecided{border-left-color:var(--undecided)}.vc.Opposed{border-left-color:var(--opposed)}
.vn{font-weight:700;font-size:1.15rem}
.vm{color:var(--muted);font-size:.88rem;margin:2px 0 10px}
.q{font-weight:600;font-size:.92rem;margin:12px 0 6px}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tb{min-height:50px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;padding:4px 6px;font-size:1rem}
.tb small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.tb.on small{color:inherit;opacity:.85}
.tb.vis.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tb.nv.on{background:#475569;border-color:#475569;color:#fff}
.sup{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sup .tb.on[data-v=Strong]{background:var(--strong);border-color:var(--strong);color:#fff}
.sup .tb.on[data-v=Leaning]{background:var(--leaning);border-color:var(--leaning);color:#fff}
.sup .tb.on[data-v=Undecided]{background:var(--undecided);border-color:var(--undecided);color:#fff}
.sup .tb.on[data-v=Opposed]{background:var(--opposed);border-color:var(--opposed);color:#fff}
.iss{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.iss .tb{min-height:58px;font-size:.95rem}
.iss .tb.on{background:var(--ink);border-color:var(--ink);color:#fff}
textarea{width:100%;min-height:58px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--brand)}
.mob{display:flex;gap:8px;align-items:center}
.mob input{flex:1;min-width:0;width:100%;height:52px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:1.15rem;letter-spacing:.06em}
.mob input:focus{outline:none;border-color:var(--brand)}
.mob input.bad{border-color:var(--opposed)}
.mob input.good{border-color:var(--ok)}
.call{flex:none;width:52px;height:52px;border-radius:12px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:1.3rem}
.mhint{font-size:.8rem;margin-top:4px;min-height:1em;color:var(--muted)}
.mhint.bad{color:var(--opposed)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cb{min-height:44px;border:2px solid var(--line);background:#fff;border-radius:10px;font-weight:600;font-size:.88rem;padding:2px 4px}
.cb small{display:block;font-weight:400;font-size:.68rem;color:var(--muted)}
.cb.on{background:#6d28d9;border-color:#6d28d9;color:#fff}.cb.on small{color:#fff;opacity:.85}
.sugg{width:100%;min-height:46px;border:2px dashed #6d28d9;background:#f5f3ff;color:#5b21b6;border-radius:10px;font-weight:700;margin:2px 0 10px}
.occ .tb.on{background:#0369a1;border-color:#0369a1;color:#fff}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.srow .sn{flex:1;min-width:0}.srow .sn b{display:block;font-size:1.05rem}.srow .sn span{color:var(--muted);font-size:.82rem}
.srow select{width:46%;height:46px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:0 6px;font-size:.95rem}
.srow select.set{border-color:#6d28d9;background:#f5f3ff}
.srow.saved{border-color:var(--ok)}
.fixbtn{width:100%;min-height:48px;border:0;border-radius:12px;background:#6d28d9;color:#fff;font-weight:700;margin:4px 0 10px}
.fold{display:flex;align-items:center;gap:10px;background:#faf8f3;border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px;width:100%;text-align:left;cursor:pointer}
.fold .fl{color:var(--muted);font-size:.85rem;min-width:62px}
.fold .fv{flex:1;font-weight:700;font-size:1rem}
.fold .fc{color:var(--brand);font-weight:700;font-size:.88rem;white-space:nowrap}
.fold.f-Strong{border-color:var(--strong)}.fold.f-Leaning{border-color:var(--leaning)}.fold.f-Undecided{border-color:var(--undecided)}.fold.f-Opposed{border-color:var(--opposed)}
.qh{display:flex;justify-content:space-between;align-items:center}
.done{border:0;background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-weight:700;font-size:.8rem}
.csel{width:100%;height:46px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:0 8px}
.next{width:100%;height:56px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:1.05rem;margin:4px 0 20px}

/* status bar */
.sync{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#1f2937;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:.92rem;display:flex;align-items:center;gap:10px;justify-content:center}
.sync.ok{background:#14532d}.sync.off{background:#7c2d12}
.toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:40;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.demo{background:#fef3c7;color:#78350f;text-align:center;font-size:.85rem;padding:6px 10px}
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spin{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
</style>
</head>
<body>

<div id="demoBar" class="demo hide">ఇది డెమో — మార్పులు ఎక్కడా సేవ్ కావు · Preview only, nothing is saved</div>

<!-- LOGIN -->
<section id="vLogin" class="login">
  <div class="box">
    <h2>మగల్లు ఓటర్ సర్వే</h2>
    <p>Magallu Voter Survey</p>
    <label class="lb">మీ పేరు <span class="en">Your name</span></label>
    <select id="lName" class="field"><option value="">— ఎంచుకోండి / Select —</option></select>
    <label class="lb">పిన్ <span class="en">4-digit PIN</span></label>
    <input id="lPin" class="field pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
    <button id="lGo" class="big">లోపలికి వెళ్ళండి <span style="font-weight:400">· Enter</span></button>
    <div id="lErr" class="err"></div>
  </div>
</section>

<!-- LIST -->
<section id="vList" class="hide">
  <div class="top">
    <div class="row">
      <h1>ఓటర్ సర్వే</h1>
      <span class="who" id="who"></span>
      <button class="iconbtn hide" id="btnFam" title="Families">👪</button>
      <button class="iconbtn hide" id="btnSur" title="Surname to caste">🏷</button>
      <button class="iconbtn" id="btnRefresh" title="Refresh">⟳</button>
      <button class="iconbtn" id="btnOut" title="Logout">⎋</button>
    </div>
    <div class="prog"><span id="progTxt">—</span><div class="bar"><i id="progBar"></i></div></div>
  </div>
  <div class="wrap">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="పేరు / ఇంటి నం. / ఓటర్ ID వెతకండి">
    </div>
    <div class="chips" id="boothChips"></div>
    <select id="secSel" class="field"></select>
    <div class="chips" id="statChips"></div>
    <div class="count" id="count"></div>
    <div id="list"><div class="loading"><div class="spin"></div>డేటా లోడ్ అవుతోంది… <br><span class="en">Loading voters…</span></div></div>
  </div>
</section>

<!-- HOUSE -->
<section id="vHouse" class="sheet hide">
  <div class="top">
    <div class="row">
      <button class="iconbtn" id="btnBack">← వెనక్కి</button>
      <h1 id="hTitle"></h1>
    </div>
    <div class="prog" id="hSub"></div>
  </div>
  <div class="wrap" id="hBody"></div>
</section>

<!-- SURNAME -> CASTE (admin) -->
<section id="vSur" class="sheet hide">
  <div class="top">
    <div class="row">
      <button class="iconbtn" id="btnSurBack">← వెనక్కి</button>
      <h1>ఇంటిపేరు → కులం</h1>
    </div>
    <div class="prog"><span id="surProg">—</span><div class="bar"><i id="surBar"></i></div></div>
  </div>
  <div class="wrap">
    <div class="search" style="margin-top:12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="sq" type="search" placeholder="ఇంటిపేరు వెతకండి · Search surname">
    </div>
    <div class="chips" id="surChips"></div>
    <div id="surFix"></div>
    <div id="surList"><div class="loading"><div class="spin"></div>లోడ్ అవుతోంది…</div></div>
  </div>
</section>

<div id="sync" class="sync ok hide"></div>
<div id="toast" class="toast"></div>

<script>
var DEMO_ROWS = /*DEMO_DATA*/[];
(function(){
"use strict";
var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var API_URL = 'https://script.google.com/macros/s/AKfycbyHaqynbw5_hGhpKyCxiLweTcQyurqLkb9h1My0TTGEO-CVzK3-fQZiCCxX6Jfl7-F-6g/exec';
var HAS_API = !HAS_GAS && /^https:\/\/script\.google\.com\//.test(API_URL);
var DEMO = !HAS_GAS && !HAS_API;
var LS = {
  get:function(k){try{return JSON.parse(localStorage.getItem('mvs_'+k));}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem('mvs_'+k,JSON.stringify(v));}catch(e){}},
  del:function(k){try{localStorage.removeItem('mvs_'+k);}catch(e){}}
};
var $ = function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var SUP = [
  {v:'Strong',te:'పూర్తి మద్దతు',en:'Strong'},
  {v:'Leaning',te:'మొగ్గు ఉంది',en:'Leaning'},
  {v:'Undecided',te:'తేల్చలేదు',en:'Undecided'},
  {v:'Opposed',te:'వ్యతిరేకం',en:'Opposed'}
];
var ISS = [
  {v:'Water',te:'💧 నీరు',en:'Water'},
  {v:'Road',te:'🛣️ రోడ్డు',en:'Road'},
  {v:'Drainage',te:'🚰 డ్రైనేజీ',en:'Drainage'},
  {v:'Pensions',te:'👵 పింఛన్',en:'Pensions'},
  {v:'Govt Schemes',te:'📋 పథకాలు',en:'Govt Schemes'},
  {v:'Other',te:'➕ ఇతర',en:'Other'}
];
var CASTE_TE = {Vaddera:'వడ్డెర',Yadav:'యాదవ్',Rajaka:'రజక',Brahmin:'బ్రాహ్మణ',Kummari:'కుమ్మరి',Vysya:'వైశ్యులు',Mala:'మాల',
  Muslim:'ముస్లిం',Madiga:'మాదిగ','Nayee Brahmin':'నాయి బ్రాహ్మణ',ST:'ఎస్టీ',Padmashali:'పద్మశాలి',Gouds:'గౌడ్స్',
  Vadrangi:'వడ్రంగి',Kamma:'కమ్మ',Kapu:'కాపు',Others:'ఇతరులు'};
var OCC_TE = {Farmer:'🌾 రైతు','Agri Labour':'వ్యవసాయ కూలీ','Daily Wage':'రోజు కూలీ',Business:'🏪 వ్యాపారం','Govt Job':'ప్రభుత్వ ఉద్యోగం',
  'Private Job':'ప్రైవేట్ ఉద్యోగం',Student:'🎓 విద్యార్థి',Homemaker:'🏠 గృహిణి',Retired:'రిటైర్డ్',Unemployed:'నిరుద్యోగి',
  'Abroad / Outside':'✈️ బయట ఊరు',Other:'ఇతర'};
var CASTE_ALIAS = {maala:'Mala',vysyas:'Vysya',vysyulu:'Vysya',vysya:'Vysya',rajaka:'Rajaka',yadava:'Yadav',yadav:'Yadav',
  'nayi-brahmin':'Nayee Brahmin','nayi brahmin':'Nayee Brahmin','nayee brahmin':'Nayee Brahmin',other:'Others',others:'Others',
  goud:'Gouds',gouds:'Gouds',gowda:'Gouds',padmasali:'Padmashali',padmashali:'Padmashali',vaddera:'Vaddera',yerukala:'ST',magali:'Nayee Brahmin',mangali:'Nayee Brahmin'};
function normCaste(k){ k=String(k||'').trim(); return CASTE_ALIAS[k.toLowerCase()] || k; }
var DEF_LISTS = {castes:Object.keys(CASTE_TE), occupations:Object.keys(OCC_TE), surnameCaste:{}};
function lists(){ return (S.user && S.user.lists) || DEF_LISTS; }
function suggestCaste(surname){
  var k = (lists().surnameCaste||{})[String(surname||'').trim().toLowerCase()];
  if (!k) return '';
  return normCaste(k);
}
var REL = {Father:'తండ్రి',Husband:'భర్త',Mother:'తల్లి',Wife:'భార్య',Other:'సంబంధి'};

var S = {
  user: LS.get('user'),           // {name,pin,booth,wards}
  rows: [], byId:{}, houses:[], hById:{},
  booth: 'all', sec: 'all', stat: 'todo', q: '', limit: 40,
  pending: LS.get('pending') || {}, // id -> {s,r,e,f}
  inflight: false, online: navigator.onLine !== false,
  openHouse: null, wards: 14,
  open: {}           // sections the volunteer opened again with "మార్చు"
};
function issues(v){ return String(v.issue||'').split(',').map(function(x){return x.trim();}).filter(Boolean); }
function foldRow(key, label, valueHtml, cls){
  return '<button class="fold '+(cls||'')+'" data-unfold="'+esc(key)+'"><span class="fl">'+label+'</span><span class="fv">'+valueHtml+'</span><span class="fc">✓ మార్చు</span></button>';
}

/* ---------- server calls ---------- */
function call(fn){
  var args = Array.prototype.slice.call(arguments,1);
  return new Promise(function(res,rej){
    if (DEMO) return setTimeout(function(){ try{ res(demoCall(fn,args)); }catch(e){ rej(e); } }, 250);
    if (HAS_API){
      fetch(API_URL, {method:'POST', redirect:'follow', credentials:'omit',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn:fn,args:args})})
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.ok) res(j.data); else rej(new Error(j && j.error || 'SERVER_ERROR')); })
        .catch(rej);
      return;
    }
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r,args);
  });
}
function demoCall(fn,args){

  if (fn==='saveUpdates'){

      if('issue' in f) r[16]=f.issue; if('notes' in f) r[17]=f.notes; if('mobile' in f) r[20]=f.mobile; if('caste' in f) r[21]=f.caste; if('occupation' in f) r[22]=f.occupation; r[18]=args[0]; }});});

/* ---------- data shaping ---------- */
function toObj(a){
  return {s:a[0],r:a[1],booth:a[2],sr:a[3],name:a[4],relT:a[5],relN:a[6],house:String(a[7]||'').trim(),age:a[8],gen:a[9],
    e:a[10],secNo:a[11],sec:String(a[12]||'').replace(/,\s*MAGALLU$/i,''),ward:a[13]===''||a[13]==null?'':Number(a[13]),
    visited:a[14]==='Visited',support:a[15]||'',issue:a[16]||'',notes:a[17]||'',vol:a[18]||'',isNew:!!a[19],mobile:a[20]?String(a[20]):'',caste:a[21]||'',occupation:a[22]||'',surname:a[23]||'',id:a[0]+':'+a[10]};
}
function natKey(h){ return String(h).split(/[^0-9]+/).filter(Boolean).map(function(n){return ('00000'+n).slice(-5);}).join('-') + '~' + h; }
function ingest(raw){
  S.rows = raw.map(toObj); S.byId = {};
  S.rows.forEach(function(v){ S.byId[v.id]=v; });
  // re-apply local unsent edits on top of server data
  Object.keys(S.pending).forEach(function(id){ var v=S.byId[id]; if(v) applyLocal(v,S.pending[id].f); });
  var map = {};
  S.rows.forEach(function(v){
    var hk = v.booth+'|'+(v.house || ('?'+v.sec+v.sr));
    var h = map[hk] || (map[hk] = {id:hk,booth:v.booth,house:v.house||'—',sec:v.sec,secNo:v.secNo,v:[]});
    h.v.push(v);
  });
  S.houses = Object.keys(map).map(function(k){ var h=map[k]; h.sort=h.booth+'|'+natKey(h.house); return h; })
    .sort(function(a,b){ return a.sort<b.sort?-1:a.sort>b.sort?1:0; });
  S.hById = map;
  buildFilters();
}
function applyLocal(v,f){
  if('ward' in f) v.ward = f.ward===''?'':Number(f.ward);
  if('visited' in f) v.visited = f.visited==='Visited';
  if('support' in f) v.support = f.support;
  if('issue' in f) v.issue = f.issue;
  if('notes' in f) v.notes = f.notes;
  if('mobile' in f) v.mobile = f.mobile;
  if('caste' in f) v.caste = f.caste;
  if('occupation' in f) v.occupation = f.occupation;
}
function cleanMobile(s){
  var d = String(s||'').replace(/\D/g,'');
  if (d.length===12 && d.indexOf('91')===0) d=d.slice(2);
  if (d.length===11 && d.charAt(0)==='0') d=d.slice(1);
  return d;
}
function validMobile(d){ return /^[6-9]\d{9}$/.test(d); }
function isDone(v){ return v.visited && !!v.support; }

/* ---------- edits & sync ---------- */
function edit(v, f){
  applyLocal(v,f); v.vol = S.user.name;
  var p = S.pending[v.id] || (S.pending[v.id] = {s:v.s,r:v.r,e:v.e,f:{}});
  for (var k in f) p.f[k] = f[k];
  LS.set('pending',S.pending);
  renderSync(); scheduleFlush(700);
}
var flushT;
function scheduleFlush(ms){ clearTimeout(flushT); flushT = setTimeout(flush, ms); }
function flush(){
  var ids = Object.keys(S.pending);
  if (!ids.length || S.inflight) return;
  if (!S.online && !DEMO){ renderSync(); return; }
  S.inflight = true; renderSync();
  var batch = ids.slice(0,40).map(function(id){ return {id:id, u:JSON.parse(JSON.stringify(S.pending[id]))}; });
  call('saveUpdates', S.user.name, S.user.pin, batch.map(function(b){return b.u;})).then(function(res){
    batch.forEach(function(b){
      var cur = S.pending[b.id]; if(!cur) return;
      // drop only fields that haven't changed again while we were sending
      for (var k in b.u.f) if (cur.f[k] === b.u.f[k]) delete cur.f[k];
      if (!Object.keys(cur.f).length) delete S.pending[b.id];
    });
    LS.set('pending',S.pending); S.inflight=false; S.online=true;
    if ((res.failed||[]).length) toast('⚠️ '+res.failed.length+' సేవ్ కాలేదు');
    renderSync();
    if (Object.keys(S.pending).length) scheduleFlush(300);
  }).catch(function(err){
    S.inflight=false;
    if (String(err && err.message).indexOf('WRONG_PIN')>=0){ logout('పిన్ మారింది. మళ్ళీ లాగిన్ అవ్వండి'); return; }
    S.online=false; renderSync(); scheduleFlush(8000);
  });
}
function renderSync(){
  var n = Object.keys(S.pending).length, el = $('sync');
  if (!S.user){ el.classList.add('hide'); return; }
  el.classList.remove('hide');
  if (!n){ el.className='sync ok'; el.textContent = DEMO ? '✓ సేవ్ అయింది (డెమో)' : '✓ అన్నీ సేవ్ అయ్యాయి · All saved'; return; }
  if (!S.online && !DEMO){ el.className='sync off'; el.textContent='📵 ఇంటర్నెట్ లేదు — '+n+' మంది వివరాలు ఫోన్‌లో ఉన్నాయి, నెట్ రాగానే పంపుతాం'; return; }
  el.className='sync'; el.textContent='⏳ '+n+' పంపుతున్నాం… · Saving';
}
window.addEventListener('online',function(){S.online=true;renderSync();scheduleFlush(200);});
window.addEventListener('offline',function(){S.online=false;renderSync();});
setInterval(function(){ if(Object.keys(S.pending).length) flush(); }, 15000);

/* ---------- list ---------- */
function houseMatches(h){
  if (S.booth!=='all' && String(h.booth)!==String(S.booth)) return false;
  if (S.sec!=='all' && h.sec!==S.sec) return false;
  var done = h.v.every(isDone);
  if (S.stat==='todo' && done) return false;
  if (S.stat==='done' && !h.v.some(isDone)) return false;
  if (S.q){
    var q=S.q;
    if (String(h.house).toLowerCase().indexOf(q)===0) return true;
    return h.v.some(function(v){ return (v.name+' '+v.relN+' '+v.e+' '+v.mobile+' '+v.caste).toLowerCase().indexOf(q)>=0; });
  }
  return true;
}

  var fd=e.target.closest('[data-fold]');
  if (fd){ delete S.open[fd.dataset.fold]; renderHouse(); return; }
  var isb=e.target.closest('[data-issue]');
  if (isb){
    var vi=S.byId[isb.closest('[data-id]').dataset.id], cur=issues(vi), x=isb.dataset.issue, at=cur.indexOf(x);
    if (at>=0) cur.splice(at,1); else cur.push(x);
    var chi={issue:cur.join(', ')}; if (cur.length && !vi.visited) chi.visited='Visited';
    S.open[vi.id+':issue']=true; edit(vi,chi); renderHouse(); return;
  }
  var pcb=e.target.closest('[data-pc]');
  if (pcb){ var vp=S.byId[pcb.closest('[data-id]').dataset.id]; edit(vp,{caste:pcb.dataset.pc}); delete S.open[vp.id+':caste']; toast('కులం ✓'); renderHouse(); return; }
  if (e.target.closest('[data-next]')){ var i=nextHouseIndex(h); if(i>=0) openHouse(S.houses[i].id); else closeHouse(); return; }
  var b=e.target.closest('[data-f]'); if(!b) return;
  var v=S.byId[b.closest('[data-id]').dataset.id], f=b.dataset.f, val=b.dataset.v, ch={};
  if (f==='visited'){ ch.visited=val; if(val==='Not Visited'){ /* keep answers, just mark */ } }
  else { ch[f] = (v[f]===val) ? '' : val; if (ch[f] && !v.visited) ch.visited='Visited'; }
  edit(v,ch);
  if (f==='support' && ch.support) toast('✓ సేవ్');
  if (ch[f]) delete S.open[v.id+':'+f];   // fold the section once answered
  renderHouse();
};
var nT={};
$('hBody').addEventListener('change',function(e){
  if(!e.target.dataset.pcaste) return;
  var v=S.byId[e.target.closest('[data-id]').dataset.id]; if(v && v.caste!==e.target.value){ edit(v,{caste:e.target.value}); toast('✓ సేవ్'); }
});
var mT={};
$('hBody').addEventListener('input',function(e){
  if(!e.target.dataset.mobile) return;
  var inp=e.target, card=inp.closest('[data-id]'), id=card.dataset.id, hint=card.querySelector('[data-mhint]');
  var d=cleanMobile(inp.value);
  inp.classList.remove('bad','good'); hint.classList.remove('bad'); hint.textContent='';
  clearTimeout(mT[id]);
  if (!d){ mT[id]=setTimeout(function(){ var v=S.byId[id]; if(v && v.mobile) edit(v,{mobile:''}); },900); return; }
  if (d.length<10){ hint.textContent=(10-d.length)+' అంకెలు ఇంకా · '+d.length+'/10'; return; }
  if (!validMobile(d)){ inp.classList.add('bad'); hint.classList.add('bad'); hint.textContent='నంబర్ సరిగా లేదు · Invalid number'; return; }
  inp.classList.add('good');
  mT[id]=setTimeout(function(){ var v=S.byId[id]; if(v && v.mobile!==d){ edit(v,{mobile:d}); hint.textContent='✓ సేవ్ అయింది'; toast('📱 నంబర్ సేవ్'); } },600);
});
$('hBody').addEventListener('input',function(e){
  if(!e.target.dataset.notes) return;
  var id=e.target.closest('[data-id]').dataset.id, val=e.target.value;
  clearTimeout(nT[id]); nT[id]=setTimeout(function(){ var v=S.byId[id]; if(v && v.notes!==val) edit(v,{notes:val}); },900);
});

/* ---------- surname -> caste (admin) ---------- */
var SU = { rows: [], q: '', mode: 'missing', pending: {}, inflight: false };
function surOpen(){
  $('vSur').classList.remove('hide'); document.body.style.overflow='hidden';
  $('surList').innerHTML='<div class="loading"><div class="spin"></div>లోడ్ అవుతోంది… · Loading surnames…</div>';
  call('getSurnames', S.user.name, S.user.pin).then(function(rows){ SU.rows=rows; surRender(); })
    .catch(function(err){ $('surList').innerHTML='<div class="empty">లోడ్ కాలేదు · '+esc(err && err.message)+'</div>'; });
}
function surClose(){ $('vSur').classList.add('hide'); document.body.style.overflow=''; }
function surRender(){
  var castes = lists().castes;
  var filled = SU.rows.filter(function(r){ return castes.indexOf(r[3])>=0; });
  var votersAll = SU.rows.reduce(function(a,r){return a+r[2];},0), votersFilled = filled.reduce(function(a,r){return a+r[2];},0);
  $('surProg').textContent = filled.length+' / '+SU.rows.length+' ఇంటిపేర్లు · '+Math.round(100*votersFilled/Math.max(votersAll,1))+'% ఓటర్లు';
  $('surBar').style.width = (100*votersFilled/Math.max(votersAll,1))+'%';
  var modes=[['missing','కులం లేనివి','Missing'],['all','అన్నీ','All'],['done','ఉన్నవి','Filled']];
  $('surChips').innerHTML = modes.map(function(x){ return '<button class="chip'+(SU.mode===x[0]?' on':'')+'" data-sm="'+x[0]+'">'+x[1]+' <span class="en" style="color:inherit;opacity:.7">'+x[2]+'</span></button>'; }).join('');
  var fix = SU.rows.filter(function(r){ return r[3] && castes.indexOf(r[3])<0 && castes.indexOf(normCaste(r[3]))>=0; });
  $('surFix').innerHTML = fix.length ? '<button class="fixbtn" id="surFixBtn">✏️ పాత స్పెల్లింగ్‌లు సరిచేయి ('+fix.length+') · e.g. '+esc(fix[0][3])+' → '+esc(normCaste(fix[0][3]))+'</button>' : '';
  var q=SU.q;
  var list = SU.rows.filter(function(r){
    var ok = castes.indexOf(r[3])>=0;
    if (SU.mode==='missing' && ok) return false;
    if (SU.mode==='done' && !ok) return false;
    return !q || r[1].toLowerCase().indexOf(q)>=0;
  });
  if (!list.length){ $('surList').innerHTML='<div class="empty">ఏమీ లేవు 🎉<br><span class="en">Nothing here</span></div>'; return; }
  $('surList').innerHTML = list.slice(0,150).map(function(r){
    var cur=r[3], extra = cur && castes.indexOf(cur)<0 ? [cur] : [];
    return '<div class="srow" data-sr="'+r[0]+'"><div class="sn"><b>'+esc(r[1])+'</b><span>'+r[2]+' ఓటర్లు'+(extra.length?' · ⚠ '+esc(cur):'')+'</span></div>'+
      '<select data-surname="'+esc(r[1])+'" class="'+(castes.indexOf(cur)>=0?'set':'')+'"><option value="">— కులం —</option>'+
      castes.concat(extra).map(function(c){ return '<option value="'+esc(c)+'"'+(c===cur?' selected':'')+'>'+esc((CASTE_TE[c]?CASTE_TE[c]+' · ':'')+c)+'</option>'; }).join('')+
      '</select></div>';
  }).join('') + (list.length>150?'<div class="empty">'+(list.length-150)+' more — use search</div>':'');
}
function surSet(row, surname, caste){
  SU.rows.forEach(function(r){ if(r[0]===row) r[3]=caste; });
  var map = (S.user.lists = S.user.lists || {castes:lists().castes, occupations:lists().occupations, surnameCaste:{}}).surnameCaste = S.user.lists.surnameCaste || {};
  if (caste) map[surname.toLowerCase()] = caste; else delete map[surname.toLowerCase()];
  LS.set('user', S.user);
  SU.pending[row] = {r:row, s:surname, c:caste};
  surFlush();
}
function surFlush(){
  var items = Object.keys(SU.pending).map(function(k){ return SU.pending[k]; });
  if (!items.length || SU.inflight) return;
  SU.inflight = true; SU.pending = {};
  $('sync').className='sync'; $('sync').textContent='⏳ '+items.length+' పంపుతున్నాం… · Saving';
  call('saveSurnameCastes', S.user.name, S.user.pin, items).then(function(res){
    SU.inflight=false; toast('✓ '+res.saved+' సేవ్'); renderSync();
    items.forEach(function(it){ var el=document.querySelector('[data-sr="'+it.r+'"]'); if(el) el.classList.add('saved'); });
    if (Object.keys(SU.pending).length) surFlush();
  }).catch(function(err){
    SU.inflight=false; items.forEach(function(it){ if(!SU.pending[it.r]) SU.pending[it.r]=it; });
    $('sync').className='sync off'; $('sync').textContent='⚠️ సేవ్ కాలేదు — మళ్ళీ ప్రయత్నిస్తాం · '+(err && err.message || '');
    setTimeout(surFlush, 6000);
  });
}
// One shared screen: on the live app the 🏷 button opens the /castes/ page
$('btnFam').onclick=function(){ location.href='family/'; };
$('btnSur').onclick=function(){ if (HAS_API) location.href='castes/'; else surOpen(); };
$('btnSurBack').onclick=function(){ surClose(); if(S.openHouse) renderHouse(); };
$('surChips').onclick=function(e){ var b=e.target.closest('[data-sm]'); if(!b) return; SU.mode=b.dataset.sm; surRender(); };
var sqT; $('sq').oninput=function(){ clearTimeout(sqT); var t=this; sqT=setTimeout(function(){ SU.q=t.value.trim().toLowerCase(); surRender(); },150); };
$('surList').addEventListener('change',function(e){
  var sel=e.target; if(!sel.dataset.surname) return;
  var row=Number(sel.closest('[data-sr]').dataset.sr);
  sel.classList.toggle('set', !!sel.value);
  surSet(row, sel.dataset.surname, sel.value);
});
$('surFix').onclick=function(e){
  if (e.target.id!=='surFixBtn') return;
  var castes=lists().castes;
  SU.rows.forEach(function(r){ if(r[3] && castes.indexOf(r[3])<0 && castes.indexOf(normCaste(r[3]))>=0) surSet(r[0], r[1], normCaste(r[3])); });
  surRender();
};

/* ---------- misc ---------- */
var tT; function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tT); tT=setTimeout(function(){t.classList.remove('show');},1300); }

function loadData(force){
  if (!force && S.fresh){ var fr=S.fresh; S.fresh=null; ingest(fr); renderList(); return Promise.resolve(); }
  var cached = LS.get('rows');
  if (cached && !force){ ingest(cached); renderList(); }
  return call('getVoters', S.user.name, S.user.pin).then(function(res){
    LS.set('rows',res.rows); ingest(res.rows); renderList(); if(S.openHouse) renderHouse();
    refreshLists();
    S.online=true; renderSync(); if (force) toast('తాజా డేటా ✓');
  }).catch(function(err){
    if (String(err && err.message).indexOf('WRONG_PIN')>=0){ logout('పిన్ మారింది. మళ్ళీ లాగిన్ అవ్వండి'); return; }
    S.online=false; renderSync();
    if (!cached) $('list').innerHTML='<div class="empty">ఇంటర్నెట్ లేదు. నెట్ వచ్చాక ⟳ నొక్కండి<br><span class="en">No internet — tap ⟳ to retry</span></div>';
  });
}
// Pick up caste lists / surname castes edited elsewhere (e.g. the /castes/ page) without re-login
function refreshLists(){
  if (DEMO || !S.user) return;
  call('login', S.user.name, S.user.pin).then(function(u){
    S.user.lists = u.lists; S.user.admin = !!u.admin; LS.set('user', S.user);
    $('btnSur').classList.toggle('hide', !S.user.admin);
    if (S.openHouse) renderHouse();
  }).catch(function(){});
}
window.addEventListener('pageshow', function(e){ if (e.persisted) refreshLists(); });
$('btnRefresh').onclick=function(){ flush(); loadData(true); };
$('btnOut').onclick=function(){ if(Object.keys(S.pending).length){ toast('ముందు సేవ్ అవ్వనివ్వండి…'); flush(); return; } logout(''); };

function logout(msg){
  S.user=null; LS.del('user'); LS.del('rows');
  $('lGo').disabled=false; $('lGo').innerHTML='లోపలికి వెళ్ళండి <span style="font-weight:400">· Enter</span>';
  $('vList').classList.add('hide'); $('vHouse').classList.add('hide'); $('vLogin').classList.remove('hide');
  $('lErr').textContent = msg||''; renderSync(); initLogin();
}
function showApp(){
  $('vLogin').classList.add('hide'); $('vList').classList.remove('hide');
  $('who').textContent = '👤 '+S.user.name;
  $('btnSur').classList.toggle('hide', !S.user.admin);
  $('btnFam').classList.toggle('hide', !HAS_API);
  S.wards = S.user.wards || 14;
  var savedBooth = LS.get('booth');
  S.booth = savedBooth || (S.user.booth ? String(S.user.booth) : 'all');
  renderSync(); loadData(false); scheduleFlush(500);
}
function initLogin(){
  call('listVolunteers').then(function(names){
    $('lName').innerHTML='<option value="">— ఎంచుకోండి / Select —</option>'+names.map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
    if (DEMO){ $('lName').value=names[0]; $('lPin').placeholder='1234'; }
  }).catch(function(err){
    var msg = String(err && err.message || err || '');
    $('lErr').textContent = navigator.onLine===false ? 'ఇంటర్నెట్ చెక్ చేయండి · Check internet'
      : 'లోడ్ కాలేదు. Chrome Incognito లో తెరవండి · Could not load ('+msg.slice(0,80)+'). Try an Incognito/private window.';
  });
}
$('lGo').onclick=function(){
  var n=$('lName').value, p=$('lPin').value.trim();
  if(!n){ $('lErr').textContent='మీ పేరు ఎంచుకోండి'; return; }
  if(!p){ $('lErr').textContent='పిన్ ఇవ్వండి'; return; }
  $('lErr').textContent=''; $('lGo').disabled=true;
  $('lGo').textContent='లోడ్ అవుతోంది… · Loading voters…';
  call('login',n,p,true).then(function(u){
    S.user={name:u.name,pin:p,booth:u.booth,wards:u.wards,lists:u.lists,admin:!!u.admin}; LS.set('user',S.user);
    if (u.voters && u.voters.rows){ LS.set('rows',u.voters.rows); S.fresh=u.voters.rows; }
    $('lGo').disabled=false; showApp();
  }).catch(function(err){
    $('lGo').disabled=false; $('lGo').innerHTML='లోపలికి వెళ్ళండి <span style="font-weight:400">· Enter</span>';
    $('lErr').textContent = String(err && err.message).indexOf('WRONG_PIN')>=0 ? 'పిన్ తప్పు · Wrong PIN' : 'ఇంటర్నెట్ చెక్ చేయండి · Check internet';
  });
};
$('lPin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('lGo').click(); });

if (DEMO) $('demoBar').classList.remove('hide');
if (S.user) showApp(); else initLogin();
})();
</script>
