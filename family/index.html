<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>👪 కుటుంబాలు · Magallu</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f6f3ec;color:#1d1b16;font-family:"Noto Sans Telugu",system-ui,sans-serif;font-size:16px}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.hide{display:none!important}.wbad{color:#854d0e;background:#fef9c3;border-radius:6px;padding:1px 6px;font-size:.82rem;white-space:nowrap;display:inline-block;margin:2px 2px 0 0}.wbad.wno{color:#57534e;background:#f1efe9}.wline{font-size:.85rem;margin:3px 0 2px}.wtot{color:#78716c;font-size:.8rem}.pc.ow{opacity:.4}
.top{position:sticky;top:0;z-index:5;background:#FACC15;color:#1c1917;padding:10px 14px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.top .r{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top h1{margin:0;font-size:1.08rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{max-width:640px;margin:4px auto 0;font-size:.85rem;opacity:.95}
.tb{border:0;background:rgba(0,0,0,.1);color:#1c1917;border-radius:10px;height:40px;padding:0 12px;font-weight:700;text-decoration:none;display:flex;align-items:center;white-space:nowrap}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 80px}
.f{width:100%;height:50px;border:2px solid #e5dfd2;border-radius:12px;padding:0 12px;background:#fff;font-size:1.02rem}
.f:focus{outline:none;border-color:#0f766e}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid #e5dfd2;background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.on{background:#1d1b16;border-color:#1d1b16;color:#fff}
.chip.warn.on{background:#b45309;border-color:#b45309}
.count{color:#6b665c;font-size:.88rem;margin:8px 2px}
.fc{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e9e2d5;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.fc b{font-size:1.06rem}.fc .m{color:#6b665c;font-size:.85rem;margin:2px 0 8px}
.sbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#e7e2d8}
.sbar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:#4b463d;margin-top:6px}
.leg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;background:var(--c)}
.c-Strong{--c:#15803d;background:#15803d}.c-Leaning{--c:#84cc16;background:#84cc16}.c-Undecided{--c:#f59e0b;background:#f59e0b}.c-Opposed{--c:#dc2626;background:#dc2626}.c-none{--c:#cbd5e1;background:#cbd5e1}
.swing{display:inline-block;background:#fef9c3;color:#854d0e;border-radius:999px;padding:1px 8px;font-size:.78rem;font-weight:700;margin-left:6px}
.contact{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed #e9e2d5;font-size:.88rem}
.contact .who{flex:1;min-width:0;color:#4b463d}
.callb{flex:none;display:inline-flex;align-items:center;gap:4px;background:#15803d;color:#fff;border-radius:10px;padding:7px 12px;font-weight:700;text-decoration:none}
.nocall{color:#9a9284;font-size:.8rem}
.b.house{background:#FACC15;color:#1c1917;width:100%;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:10px}
.warnb{display:inline-block;background:#fef3c7;color:#92400e;border-radius:999px;padding:1px 8px;font-size:.78rem;font-weight:700;margin-left:6px}
.more{width:100%;height:50px;border:2px dashed #d6cfc0;background:transparent;border-radius:12px;font-weight:700;color:#6b665c}
.card{background:#fff;border:1px solid #e9e2d5;border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:1rem}
/* tree */
.tree{margin:0;padding:0}
.node{margin:6px 0}
.couple{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.pc{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #e5dfd2;border-radius:12px;padding:8px 10px;cursor:pointer;min-width:0;max-width:100%;text-align:left}
.pc .d{width:12px;height:12px;border-radius:50%;flex:none;background:#cbd5e1}
.pc b{display:block;font-size:.96rem;line-height:1.25}.pc span{display:block;color:#6b665c;font-size:.76rem}
.pc.nv{border-style:dashed;background:#f8f7f4;color:#6b665c}
.pc.me{border-color:#0f766e;box-shadow:0 0 0 2px #99f6e4}
.pc.chk{border-color:#f59e0b}
.flab{font-weight:700;font-size:.95rem;margin:4px 2px 6px}.flab .en{color:#6b665c;font-size:.78em;font-weight:400}
.wchips{flex-wrap:wrap;overflow:visible;gap:6px}
.wtog{width:100%;display:flex;align-items:center;gap:8px;min-height:46px;border:2px solid #e5dfd2;background:#fff;border-radius:12px;padding:0 12px;font-weight:700;font-size:.95rem;margin:2px 0 8px;text-align:left;cursor:pointer;color:inherit}.wtog .wv{flex:1;font-weight:400;color:#57534e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wtog .wc{color:#78716c}.wtog.act{border-color:#ca8a04;background:#fef9c3}.wtog.act .wv{color:#1c1917;font-weight:700}
.wchips .chip{min-width:48px;padding:5px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:1.02rem}
.wchips .chip small{font-weight:400;font-size:.66rem;opacity:.75}
.clrw{position:relative;display:block}.clrx{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:#e7e5e4;color:#44403c;font-size:1rem;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2}input[type=search]{padding-right:48px!important}input[type=search]::-webkit-search-cancel-button{display:none}
.pc.r26{border-left:5px solid #f97316}.pc .r26t{color:#c2410c;font-weight:700}
.pc.gone{border:2px solid #fecaca;border-left:5px solid #dc2626;background:#fef2f2;color:#7f1d1d}.pc.gone b{text-decoration:line-through;text-decoration-color:rgba(127,29,29,.4)}.pc.gone span{color:#b91c1c}
.pc.fh{border-color:#ca8a04;background:#fef9c3;box-shadow:0 0 0 2px #fde047}
.pc .crown{font-size:.72rem;font-weight:700;color:#854d0e}
.fhead{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #e5dfd2}.fhead .who{flex:1}
.fhpick{background:#fef9c3;border:2px dashed #ca8a04;border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:700;color:#854d0e}
#ftree.picking .pc.nv{opacity:.45;pointer-events:none}#ftree.picking .pc{border-style:dashed}
.amp{align-self:center;color:#9a9284;font-weight:700}
.kids{margin-left:14px;padding-left:12px;border-left:3px solid #d6e9e6}
/* person */
.pr{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #f0ebe1}
.pr:first-of-type{border-top:0}
.pr .l{color:#6b665c;font-size:.88rem;min-width:84px}
.pr .v{flex:1;text-align:right}
.lnk{background:none;border:0;color:#0f766e;font-weight:700;text-decoration:underline;padding:0;cursor:pointer;text-align:right}
.btns{display:flex;gap:8px;margin-top:10px}
.b{flex:1;min-height:48px;border:0;border-radius:12px;font-weight:700}
.b.ok{background:#15803d;color:#fff}.b.ch{background:#1d1b16;color:#fff}.b.fam{background:#0f766e;color:#fff;width:100%}
.hit{margin-top:4px;font-weight:700;color:#0f766e;font-size:.9rem}
.lead{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #e5dfd2}.lead .who{flex:1}
.lead.edit{display:block}.b.xb{background:#fff;color:#b91c1c;border:1px solid #fca5a5}.lmini{margin-top:4px;font-size:.88rem;color:#6d28d9}
.relbox{background:#f0fdfa;border:2px solid #99f6e4;border-radius:12px;padding:12px;margin-top:6px}
.relbox.chk{background:#fffbeb;border-color:#fcd34d}
.b.add{background:#fde047;color:#1d1b16;width:100%;margin-top:10px}.b.cancel{background:#eef2f1;color:#1d1b16;width:100%;margin-top:8px}
.pk{margin-top:12px;border-top:1px dashed #e5dfd2;padding-top:10px}.pkl{font-weight:700;margin:8px 0 6px;font-size:.92rem}
.tchips{display:flex;flex-wrap:wrap;gap:6px}.tchips .chip{padding:8px 12px}
.xh{margin-top:12px;font-weight:700;font-size:.85rem;color:#6b665c}
.xr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f1ece2}.xr span{flex:1}
.xdel{border:1px solid #fca5a5;background:#fff;color:#b91c1c;border-radius:8px;padding:6px 10px;font-weight:700}.xdel.sure{background:#b91c1c;color:#fff}
.pick{max-height:55vh;overflow:auto;margin-top:10px}
.po{display:block;width:100%;text-align:left;background:#fff;border:1px solid #e9e2d5;border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.po span{color:#6b665c;font-size:.8rem}
.po.none{background:#f8f7f4;font-weight:700}
.msg{text-align:center;color:#6b665c;padding:40px 10px}
.st{position:fixed;left:0;right:0;bottom:0;background:#14532d;color:#fff;text-align:center;padding:10px;font-size:.9rem;z-index:9}
.st.busy{background:#1f2937}.st.bad{background:#7c2d12}
.box{background:#fff;border-top:8px solid #FACC15;border-radius:18px;padding:22px 18px;margin-top:40px;box-shadow:0 6px 24px rgba(0,0,0,.07)}
label{display:block;font-weight:700;margin:14px 0 6px}
.pin{text-align:center;letter-spacing:.5em;font-size:1.4rem}
.go{width:100%;height:54px;border:0;border-radius:14px;background:#FACC15;color:#1c1917;box-shadow:0 2px 0 #CA8A04;font-size:1.05rem;font-weight:700;margin-top:18px}
.err{color:#dc2626;font-weight:700;margin-top:10px;min-height:1.2em}
</style>
</head>
<body>

<section id="vLogin" class="wrap hide">
  <div class="box">
    <h2 style="margin:0">👪 కుటుంబాలు</h2>
    <div style="color:#6b665c">Magallu families · volunteer login</div>
    <label>మీ పేరు · Name</label>
    <select id="who" class="f"><option value="">— Select —</option></select>
    <label>పిన్ · PIN</label>
    <input id="pin" class="f pin" type="password" inputmode="numeric" maxlength="6">
    <button id="go" class="go">లోపలికి · Enter</button>
    <div id="err" class="err"></div>
  </div>
</section>

<section id="vList" class="hide">
  <div class="top">
    <div class="r"><a class="tb" href="../">🏠 యాప్</a><h1>👪 కుటుంబాలు</h1><button class="tb" id="reload" title="Refresh">⟳</button></div>
    <div class="sub" id="lsub">—</div>
  </div>
  <div class="wrap">
    <input id="q" class="f" type="search" placeholder="పేరు / ఇంటిపేరు / ఇంటి నం. వెతకండి">
    <div class="chips" id="sizeChips"></div>
    <div class="chips" id="boothChips"></div>
    <button class="wtog" id="wtogFam"></button>
    <div class="chips wchips hide" id="wardChips"></div>
    <div class="count" id="lcount"></div>
    <div id="flist"><div class="msg">లోడ్ అవుతోంది… · Loading…</div></div>
  </div>
</section>

<section id="vFam" class="hide">
  <div class="top">
    <div class="r"><button class="tb" data-back title="Back">←</button><h1 id="ftitle"></h1><button class="tb" data-home>👪 కుటుంబాలు</button></div>
    <div class="sub" id="fsub"></div>
  </div>
  <div class="wrap">
    <div class="card"><div class="sbar" id="fbar"></div><div class="leg" id="fleg"></div><div id="fcontact"></div></div>
    <div class="count">పేరు నొక్కితే వివరాలు, సరిచేయడం · Tap a name to see or fix links</div>
    <div id="ftree" class="tree"></div>
  </div>
</section>

<section id="vPerson" class="hide">
  <div class="top">
    <div class="r"><button class="tb" data-back title="Back">←</button><h1 id="ptitle"></h1><button class="tb" data-home>👪 కుటుంబాలు</button></div>
    <div class="sub" id="psub"></div>
  </div>
  <div class="wrap" id="pbody"></div>
</section>

<div id="st" class="st hide"></div>

<script src="engine.js"></script>
<script src="../fuzzy.js"></script>
<script>
(function(){
"use strict";
var API = 'https://script.google.com/macros/s/AKfycbxBKKU-9V2beqYxQ4JViAwdEveXQgiKllK5vgi8ZLKF20ozjdxNOuxMr5tndZpVMvkiBg/exec';
var SUP = [['Strong','పూర్తి మద్దతు'],['Leaning','మొగ్గు'],['Undecided','తేల్చలేదు'],['Opposed','వ్యతిరేకం'],['none','అడగలేదు']];
var CASTE_TE = {Madiga:'మాదిగ',Kamma:'కమ్మ',Kapu:'కాపు',Vaddera:'వడ్డెర',Muslim:'ముస్లిం',Mala:'మాల',Yadav:'యాదవ్',Rajaka:'రజక',
  'Nayee Brahmin':'నాయి బ్రాహ్మణ',Vysya:'వైశ్యులు',Kummari:'కుమ్మరి',Vadrangi:'వడ్రంగి',ST:'ఎస్టీ',Brahmin:'బ్రాహ్మణ',Padmashali:'పద్మశాలి',Gouds:'గౌడ్స్',Others:'ఇతరులు'};
function cte(c){ return c ? (CASTE_TE[c]||c) : ''; }
var REL = {Father:'తండ్రి',Husband:'భర్త',Mother:'తల్లి',Wife:'భార్య',Other:'భార్య/భర్త',Son:'కొడుకు',Daughter:'కూతురు',Brother:'అన్న/తమ్ముడు',Sister:'అక్క/చెల్లి',Relative:'బంధువు'};
var TYPES = ['Father','Mother','Husband','Wife','Son','Daughter','Brother','Sister','Relative'];
var TYPE_G = {Father:'Male',Husband:'Male',Son:'Male',Brother:'Male',Mother:'Female',Wife:'Female',Daughter:'Female',Sister:'Female'};
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var LS = { get:function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
           set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function call(fn, args){
  return fetch(API, { method:'POST', redirect:'follow', credentials:'omit', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ fn:fn, args:args||[] }) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ok) return j.data; throw new Error(j && j.error || 'SERVER_ERROR'); });
}
function RO(){ if (U && U.reader){ st('bad','👁 చూడటానికి మాత్రమే — మార్పులు చేయలేరు · View only'); return true; } return false; }
function st(cls, text){ var e=$('st'); e.className='st '+cls; e.textContent=text; }

var U = LS.get('mvs_user');           // shared with the volunteer app
var TE = {}, DATA = null, M = null, links = {}, queue = {}, busy = false, PK = null;  // PK = open picker {slot, as}
var F = { q:'', size:2, booth:'all', wsel:[], check:false, sur:'', limit:40 }, scrolls = {};

fetch('te_surnames.json').then(function(r){ return r.json(); }).then(function(j){ TE=j; if (M) route(); }).catch(function(){});
function tes(s){ return TE[s] || ''; }

/* ---------- login & data ---------- */
function showLogin(msg){
  ['vList','vFam','vPerson'].forEach(function(v){ $(v).classList.add('hide'); }); $('vLogin').classList.remove('hide');
  $('err').textContent = msg||'';
  call('listVolunteers').then(function(n){
    $('who').innerHTML='<option value="">— Select —</option>'+n.map(function(x){return '<option>'+esc(x)+'</option>';}).join('');
  }).catch(function(){ $('err').textContent='ఇంటర్నెట్ చెక్ చేయండి · Check internet'; });
}
$('go').onclick=function(){
  var n=$('who').value, p=$('pin').value.trim(); if(!n||!p){ $('err').textContent='పేరు, పిన్ ఇవ్వండి'; return; }
  $('go').disabled=true; $('go').textContent='లోడ్ అవుతోంది…';
  call('login',[n,p]).then(function(u){
    U = Object.assign(LS.get('mvs_user')||{}, {name:u.name,pin:p,booth:u.booth,wards:u.wards,lists:u.lists,admin:!!u.admin,reader:!!u.reader});
    LS.set('mvs_user',U); $('vLogin').classList.add('hide'); load(true);
  }).catch(function(e){ $('err').textContent = String(e.message)==='WRONG_PIN' ? 'పిన్ తప్పు · Wrong PIN' : 'లోడ్ కాలేదు · '+e.message; })
    .then(function(){ $('go').disabled=false; $('go').textContent='లోపలికి · Enter'; });
};
$('pin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('go').click(); });

function load(force){
  var cached = LS.get('fam_data');
  if (cached && !force){ DATA=cached; rebuild(); route(); }
  else $('flist').innerHTML='<div class="msg">కుటుంబాలు తయారవుతున్నాయి… · Building families…</div>';
  return call('getFamilyData',[U.name,U.pin]).then(function(d){
    DATA=d; LS.set('fam_data',d); rebuild(); route(); st('','✓ తాజా · Up to date');
  }).catch(function(e){
    if (String(e.message)==='WRONG_PIN'){ LS.set('mvs_user',null); U=null; showLogin('మళ్ళీ లాగిన్ అవ్వండి · Please log in again'); return; }
    if (!DATA) $('flist').innerHTML='<div class="msg">లోడ్ కాలేదు · '+esc(e.message)+'</div>';
    st('bad','📵 ఇంటర్నెట్ లేదు — పాత డేటా చూపిస్తున్నాం · Offline');
  });
}
function rebuild(){
  links = Object.assign({}, DATA.links||{}, pendingLinks());
  M = FamilyEngine.build(DATA.voters, links, allExtras());
  M.byHead = {}; M.families.forEach(function(f){ M.byHead[f.head]=f; });
}
function pendingLinks(){ var o={}; Object.keys(queue).forEach(function(k){ var q=queue[k]; if(!q.slot) o[q.e]={to:q.to, ok:q.ok, as:q.as||''}; }); return o; }
function allExtras(){
  var ex={}; Object.keys(DATA.extras||{}).forEach(function(e){ ex[e]=DATA.extras[e].slice(); });
  Object.keys(queue).forEach(function(k){ var q=queue[k]; if(!q.slot) return;
    var a=(ex[q.e]||[]).filter(function(x){ return x.slot!==q.slot; }); if (q.to && q.to!=='none') a.push({to:q.to, as:q.as, slot:q.slot}); ex[q.e]=a; });
  return ex;
}
$('reload').onclick=function(){ load(true); };

/* ---------- helpers ---------- */
function P(id){ return M.P[id]; }
// a family tree can live in several wards: {ward: voters} ('none' = house not mapped yet)
function famWards(f){ var c={}; f.members.forEach(function(id){ var p=P(id); if (p.vote){ var w=p.ward||'none'; c[w]=(c[w]||0)+1; } }); return c; }
function wOrd(a,b){ return (a==='none')-(b==='none') || Number(a)-Number(b); }
function inSel(p){ return !F.wsel.length || F.wsel.indexOf(p.ward||'none')>=0; }
// with a ward filter on, only the voters living in the chosen wards count
function subFam(f){
  if (!F.wsel.length) return f;
  var g={voters:0, support:{}, houses:{}};
  f.members.forEach(function(id){ var p=P(id); if (p.vote && inSel(p)){ g.voters++; g.houses[p.hk]=1; g.support[p.support||'-']=(g.support[p.support||'-']||0)+1; } });
  g.houseCount=Object.keys(g.houses).length; return g;
}
function wardLine(f){
  var c=famWards(f), ks=Object.keys(c).sort(wOrd);
  if (F.wsel.length){ var g=subFam(f);

function treeHtml(id, seen, me){

  sp.forEach(function(s){ seen[s]=1; });
  var kids = p.kids.slice();
  sp.forEach(function(s){ P(s).kids.forEach(function(k){ if(kids.indexOf(k)<0) kids.push(k); }); });
  kids = kids.filter(function(k){ return !seen[k]; }).sort(function(a,b){ return (P(b).age||0)-(P(a).age||0); });
  return '<div class="node"><div class="couple">'+pcard(p, me===id)+sp.map(function(s){ return '<span class="amp">+</span>'+pcard(P(s), me===s); }).join('')+'</div>'+
    (kids.length?'<div class="kids">'+kids.map(function(k){ return treeHtml(k, seen, me); }).join('')+'</div>':'')+'</div>';

var LASTF=null;
function renderFam(head, me){
  if (head!==LASTF){ LEDIT=false; HPICK=false; LASTF=head; }
  var f = M.byHead[head] || famOf(head);
  if (!f){ go(''); return; }
  $('ftitle').textContent = displayName(famHead(f)||P(f.head))+' కుటుంబం';
  $('fsub').textContent = (surOf(f)?surOf(f)+' · ':'')+(f.caste?cte(f.caste)+' · ':'')+f.voters+' ఓటర్లు · '+f.houseCount+' ఇళ్ళు'+(f.check?' · ⚠ '+f.check+' సరిచూడాలి':'');
  $('fbar').innerHTML = wardLine(f) + '<div class="sbar">'+barHtml(subFam(f))+'</div>'; $('fbar').className=''; $('fleg').innerHTML = legHtml(subFam(f)); $('fcontact').innerHTML = contactHtml(f) + headHtml(f) + leaderHtml(f);
  var seen={}, html=f.roots.map(function(r){ return treeHtml(r, seen, me); }).join('');
  f.members.forEach(function(id){ if(!seen[id]) html+=treeHtml(id, seen, me); });
  $('ftree').innerHTML = html; $('ftree').classList.toggle('picking', HPICK);
}
$('ftree').onclick=function(e){ var b=e.target.closest('[data-p]'); if(!b) return;
  if (HPICK){ var f=M.byHead[cur().f]||famOf(cur().f); if (f && P(b.dataset.p).vote) setHead(f, b.dataset.p); return; }
  go('p='+encodeURIComponent(b.dataset.p)); };

/* ---------- person ---------- */
function plink(id){ var p=P(id); return p?'<button class="lnk" data-p="'+esc(id)+'">'+esc(displayName(p))+(p.vote?'':' (ఓటు లేదు)')+'</button>':''; }
function renderPerson(id, picking){
  var p=P(id); if(!p){ go(''); return; }
  $('ptitle').textContent = displayName(p);
  if (p.gone){ $('psub').textContent = '✕ 2026 జాబితా నుండి తొలగించారు: '+goneTe(p.gone)+' · Removed from the 2026 roll: '+p.gone+(p.house?' · 🏠 '+p.house:''); }
  else $('psub').textContent = p.vote ? ((p.g==='Female'?'👩 స్త్రీ':'👨 పురుషుడు')+' · '+(p.age||'')+' ఏళ్ళు'+(p.caste?' · '+cte(p.caste):'')+' · 🏠 '+(p.house||'—')+' · '+(p.street||'')+' · బూత్ '+p.booth) : 'ఓటు లేదు · not on the voter list';
  var f = famOf(id), h='';
  if (p.vote){
    h += '<a class="b house" href="../#v='+encodeURIComponent(id)+'">🏠 ఈ ఇంటిని యాప్‌లో తెరవండి · Open house</a>';
    if (p.mobile) h += '<div class="card" style="display:flex;align-items:center;gap:10px"><span style="flex:1">📱 '+esc(p.mobile)+'</span><a class="callb" href="tel:'+esc(p.mobile)+'">📞 కాల్</a></div>';
    var r = p.rel && P(p.rel), relLbl = REL[p.rt]||p.rt;
    h += '<div class="card"><h3>జాబితాలో ఉన్న సంబంధం · As on voter list</h3>'+
      '<div>'+esc(relLbl)+': <b>'+esc(p.rn||'—')+'</b></div>'+
      (p.as&&p.as!==p.rt?'<div style="margin-top:4px;color:#6d28d9;font-weight:700">సరిచేసిన సంబంధం · Corrected: '+esc(REL[p.as]||p.as)+'</div>':'')+
      '<div class="relbox'+(r&&!p.sure?' chk':'')+'">'+
        (r ? 'అనుసంధానం · Linked to: '+plink(r.id)+(r.vote?' <span style="color:#6b665c;font-size:.8rem">(🏠 '+esc(r.house)+', '+(r.age||'')+')</span>':'')+
             '<div style="margin-top:6px;font-weight:700">'+(p.sure?'✓ సరైనది · '+(p.manual||(links[id]&&links[id].ok)?'confirmed':'auto'):'⚠ సరిచూడండి · please check')+'</div>'
           : 'ఓటర్లలో దొరకలేదు · Not found among voters')+
      '</div>'+
      '<div class="btns">'+(r&&!p.sure?'<button class="b ok" data-ok="'+esc(id)+'">✓ సరైనది</button>':'')+
        '<button class="b ch" data-pick="">✏️ '+(r?'మార్చు · Change':'ఎంచుకో · Pick')+'</button></div>'+
      (picking&&PK&&!PK.slot?pickerHtml(p):'')+
      '</div>';
  }
  var rows = [];
  if (p.father) rows.push(['తండ్రి', plink(p.father)]);
  if (p.mother) rows.push(['తల్లి', plink(p.mother)]);
  if (p.spouses.length) rows.push([p.g==='Female'?'భర్త':'భార్య', p.spouses.map(plink).join('<br>')]);
  var sib = {}; [p.father,p.mother].forEach(function(x){ if(x) P(x).kids.forEach(function(k){ if(k!==id) sib[k]=1; }); }); p.sibs.forEach(function(k){ sib[k]=1; });
  if (Object.keys(sib).length) rows.push(['తోబుట్టువులు', Object.keys(sib).map(plink).join('<br>')]);
  if (p.kids.length) rows.push(['పిల్లలు', p.kids.map(plink).join('<br>')]);
  if (p.rels.length) rows.push(['బంధువులు', p.rels.map(plink).join('<br>')]);
  var added = (p.extra||[]).map(function(x){ return '<div class="xr"><span>'+esc(REL[x.as]||x.as)+': '+plink(x.to)+'</span><button class="xdel" data-del="'+esc(x.slot)+'" aria-label="remove">✕</button></div>'; }).join('');
  h += '<div class="card"><h3>కుటుంబ సంబంధాలు · Relations</h3>'+(rows.length?rows.map(function(x){ return '<div class="pr"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>'; }).join(''):'<div style="color:#6b665c">సంబంధాలు లేవు</div>')+
    (added?'<div class="xh">మీరు జోడించినవి · Added by you</div>'+added:'')+
    (p.vote ? (picking&&PK&&PK.slot ? pickerHtml(p) : '<button class="b add" data-add="1">➕ ఇంకో సంబంధం జోడించు · Add relation</button>') : '')+
    '</div>';
  if (f && f.voters>1) h += '<button class="b fam" data-fam="'+esc(f.head)+'">👪 కుటుంబ వృక్షం చూడండి · '+f.voters+' ఓటర్లు</button>';
  $('pbody').innerHTML = h;
  if (picking) { renderPick(id, ''); var pq=$('pq'); if(pq) pq.focus(); }
}
function pickerHtml(p){
  return '<div class="pk"><div class="pkl">1. ఈ వ్యక్తి '+esc(displayName(p))+' కి ఏమవుతారు? · Who is the person to them?</div>'+
    '<div class="tchips">'+TYPES.map(function(t){ return '<button class="chip'+(PK.as===t?' on':'')+'" data-as="'+t+'">'+REL[t]+'</button>'; }).join('')+'</div>'+
    '<div class="pkl">2. వ్యక్తిని ఎంచుకోండి · Pick the person</div>'+
    '<input class="f" id="pq" placeholder="పేరు / ఇంటి నెం. వెతకండి · Search name or house">'+
    '<div class="pick" id="plist"></div><button class="b cancel" data-cancel="1">రద్దు · Cancel</button></div>';
}
function candidates(p, q, as){
  var want = TYPE_G[as] || '';
  var all = Object.keys(M.P).map(P).filter(function(c){ return c.id!==p.id && (c.vote || c.sur===p.sur); });
  var rk = FamilyEngine.key(p.rn, p.sur), Q = q ? Fuzzy.query(q) : null;
  if (q) all = all.filter(function(c){ c._q = (c.house||'').toLowerCase().indexOf(q)===0 ? 20 : Fuzzy.score(c.name, Q); return c._q>0; });
  else all = all.filter(function(c){ c._q=0; return c.sur===p.sur || c.hk===p.hk || FamilyEngine.key(c.name,c.sur)===rk; });
  function sc(c){ return c._q*2 + (c.hk===p.hk?6:0)+(c.sur===p.sur?3:0)+(c.street===p.street?1:0)+(FamilyEngine.key(c.name,c.sur)===rk?4:0)+(!want||c.g===want?3:0); }
  return all.sort(function(a,b){ return sc(b)-sc(a); }).slice(0,60);
}
function renderPick(id, q){
  var p=P(id), c=candidates(p, q, PK&&PK.as);
  $('plist').innerHTML = (PK&&!PK.slot?'<button class="po none" data-set="none">✕ ఓటర్లలో లేరు · Not on the voter list</button>':'')+
    c.map(function(x){ return '<button class="po" data-set="'+esc(x.id)+'"><b>'+(x.g==='Female'?'👩 ':'👨 ')+esc(x.name)+'</b><br><span>'+(x.vote?(x.age||'')+' ఏళ్ళు · 🏠 '+esc(x.house)+' · '+esc(x.street):'ఓటు లేదు · shared relative')+'</span></button>'; }).join('');
  var inp=$('pq'); if (inp && !inp.dataset.bound){ inp.dataset.bound=1; var t; inp.oninput=function(){ clearTimeout(t); var v=this.value; t=setTimeout(function(){ renderPick(id, v.trim().toLowerCase()); },150); }; }
}
$('pbody').onclick=function(e){
  var t;
  if ((t=e.target.closest('[data-p]'))) { go('p='+encodeURIComponent(t.dataset.p)); return; }
  if ((t=e.target.closest('[data-fam]'))) { go('f='+encodeURIComponent(t.dataset.fam)+'&me='+encodeURIComponent(cur().p||'')); return; }
  if ((t=e.target.closest('[data-ok]'))) { var p=P(t.dataset.ok); setLink(p, p.rel, true); return; }
  var me = P(cur().p);
  if ((t=e.target.closest('[data-pick],[data-add]')) && RO()) return;
  if ((t=e.target.closest('[data-pick]'))) { PK={slot:'', as: me.as || (me.rt==='Other' ? (me.g==='Male'?'Wife':'Husband') : me.rt)}; renderPerson(me.id, true); return; }
  if ((t=e.target.closest('[data-add]'))) { PK={slot:'x'+Date.now().toString(36), as:'Relative'}; renderPerson(me.id, true); return; }
  if ((t=e.target.closest('[data-cancel]'))) { PK=null; renderPerson(me.id, false); return; }
  if ((t=e.target.closest('[data-as]'))) { PK.as=t.dataset.as; e.currentTarget.querySelectorAll('[data-as]').forEach(function(b){ b.classList.toggle('on', b===t); });
    var pq=$('pq'); renderPick(me.id, pq?pq.value.trim().toLowerCase():''); return; }
  if ((t=e.target.closest('[data-del]'))) { if (confirmDel(t)) setLink(me, 'none', true, '', t.dataset.del); return; }
  if ((t=e.target.closest('[data-set]'))) { var pk=PK; PK=null; setLink(me, t.dataset.set, true, pk?pk.as:'', pk?pk.slot:''); return; }
};
function confirmDel(btn){ if (btn.dataset.sure) return true; btn.dataset.sure=1; btn.textContent='తీసేయాలా? ✓'; btn.classList.add('sure'); return false; }
function setLink(p, to, ok, as, slot){
  if (RO()) return;
  if (!slot && as && (as===p.rt || (p.rt==='Other' && (as==='Husband'||as==='Wife')))) as='';
  queue[p.id+'|'+(slot||'')] = { e:p.id, n:p.name, to:to||'none', ok:!!ok, as:as||'', slot:slot||'' };
  rebuild(); route(); save();
}
function save(){
  var items = Object.keys(queue).map(function(k){ return queue[k]; });
  if (!items.length || busy) return;
  busy=true; st('busy','⏳ సేవ్ అవుతోంది… · Saving');
  call('saveFamilyLinks',[U.name,U.pin,items]).then(function(){
    busy=false;
    items.forEach(function(it){
      if (!it.slot) DATA.links[it.e]={to:it.to, ok:it.ok, as:it.as};
      else { DATA.extras=DATA.extras||{}; var a=(DATA.extras[it.e]||[]).filter(function(x){ return x.slot!==it.slot; });
        if (it.to!=='none') a.push({to:it.to, as:it.as, slot:it.slot}); DATA.extras[it.e]=a; }
      var k=it.e+'|'+it.slot; if (queue[k]===it) delete queue[k]; });
    LS.set('fam_data', DATA);
    if (Object.keys(queue).length) save(); else st('','✓ సేవ్ అయింది · Saved');
  }).catch(function(e){ busy=false; st('bad','⚠️ సేవ్ కాలేదు, మళ్ళీ ప్రయత్నిస్తాం · Retrying'); setTimeout(save,5000); });
}
window.addEventListener('beforeunload',function(e){ if(busy||Object.keys(queue).length){ e.preventDefault(); e.returnValue=''; } });

/* ---------- routing (phone back button works) ---------- */
function cur(){ var o={}; location.hash.slice(1).split('&').forEach(function(kv){ var i=kv.indexOf('='); if(i>0) o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1)); }); return o; }
function go(h){ scrolls[location.hash]=window.scrollY; location.hash=h; }
document.addEventListener('click',function(e){ if(e.target.closest('[data-home]')){ go(''); return; } if(e.target.closest('[data-back]')){ if (history.length>1) history.back(); else location.hash=''; } });
function route(){
  if (!M) return;
  var c=cur(); ['vList','vFam','vPerson'].forEach(function(v){ $(v).classList.add('hide'); });
  if (c.p){ $('vPerson').classList.remove('hide'); renderPerson(c.p, false); }
  else if (c.f){ $('vFam').classList.remove('hide'); renderFam(c.f, c.me); }
  else { if (c.s!==undefined){ F.sur=c.s; F.size=1; F.check=false; } $('vList').classList.remove('hide'); renderList(); }
  window.scrollTo(0, scrolls[location.hash]||0);
}
window.addEventListener('hashchange', route);


/* ✕ button inside a search box: clears it in one tap */
function addClear(inp){
  if (!inp || inp.dataset.clr) return; inp.dataset.clr = 1;
  var w = document.createElement('span'); w.className = 'clrw'; inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
  var b = document.createElement('button'); b.type = 'button'; b.className = 'clrx'; b.textContent = '✕'; b.setAttribute('aria-label', 'Clear'); w.appendChild(b);
  function upd(){ b.style.display = inp.value ? 'flex' : 'none'; }
  inp.addEventListener('input', upd);
  b.onclick = function(){ inp.value = ''; inp.dispatchEvent(new Event('input', {bubbles:true})); upd(); inp.focus(); };
  upd();
}
addClear($('q'));
if (U && U.name && U.pin) load(false); else showLogin('');
})();
</script>
